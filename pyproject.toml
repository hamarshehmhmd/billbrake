[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "billbrake"
version = "0.1.0"
description = "Hard spend caps for LLM APIs and cloud bills: block requests and kill resources instead of just alerting."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["starlette>=0.37", "uvicorn>=0.29", "httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "boto3>=1.34", "ruff>=0.5"]

[project.scripts]
billbrake = "billbrake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/billbrake"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 125

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
