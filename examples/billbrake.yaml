db_path: billbrake.db
admin_token: ${BILLBRAKE_ADMIN_TOKEN}   # optional; protects /billbrake/status
upstreams:
  openai:
    base_url: https://api.openai.com
    api_key_env: OPENAI_API_KEY
  anthropic:
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
projects:
  demo:
    keys: ["bb-demo-key"]
    daily_usd: 5
    monthly_usd: 50
    reserve_usd: 0.10
  agents:
    keys: ["${AGENTS_PROXY_KEY}"]
    monthly_usd: 200
pricing:            # add or override per-1M-token USD prices
  my-finetune:
    input: 3.0
    output: 12.0
